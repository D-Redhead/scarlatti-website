# Testserver: bij elke push naar main → foto's ophalen, noindex toevoegen, publiceren op GitHub Pages.
name: Testserver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Foto's ophalen
        run: bash fetch-assets.sh
      - name: Site samenstellen (testversie, niet indexeren)
        run: |
          mkdir -p _site
          cp -r *.html css js assets _site/
          sed -i 's#<head>#<head>\n<meta name="robots" content="noindex, nofollow">#' _site/*.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
